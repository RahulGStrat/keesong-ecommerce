<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Basket item</title>
</head>

<body>
  <!-- body content start -->
  <div class="content-wrapper">
    <div class="kse-basket-item">
      <div class="kse-basket-item__image">
        <img src="../assets/images/fresh-non.png" alt="" />
        <span class="kse-basket-item__badge">7% OFF</span>
      </div>

      <div class="kse-basket-item__content">
        <h3 class="kse-basket-item__title">Fresh Sakura Chicken<br>[Non-Halal] - 1.3kg</h3>
        <p class="kse-basket-item__category">SKU: HSCFWH0000A001.3VCM</p>

        <div class="kse-basket-item__quantity">
          <div>
            <span class="quantity">Quantity:</span>
            <button>–</button>
            <span class="number">1</span>
            <button>+</button>
          </div>
          <div class="kse-basket-item__price">
            <span class="kse-basket-item__current">$$14.00/pkt</span>
            <span class="kse-basket-item__old">$$16.00/pkt</span>
          </div>
        </div>
      </div>

      <button class="kse-basket-item__remove">✕</button>
    </div>
  </div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
