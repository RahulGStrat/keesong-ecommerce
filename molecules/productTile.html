<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Product Tile</title>
  <style>
    .kse-PdTile {
      width: 250px;
      margin: 50px auto;
    }
  </style>
</head>

<body>
  <!-- body content start -->
  <div class="" style="display: flex; justify-content: space-between; gap:0px;">

    <div class="kse-PdTile">
      <div class="kse-PdTile__image-wrapper">
        <div class="kse-PdTile__badge"><span>15 <small>%</small> OFF</span> </div>
        <img src="../assets/images/chicken-1.png" alt="Chicken" class="kse-PdTile__image">
      </div>

      <div class="kse-PdTile__content">
        <h3 class="kse-PdTile__title">Lorem ipsum dolor sit</h3>
        <p class="kse-PdTile__desc">
          Lorem ipsum dolor sit amet, consectetuer adipiscing elit sed.
        </p>

        <div class="kse-PdTile__bottom">
          <div class="kse-PdTile__price">$00.0</div>

          <div class="kse-PdTile__actions">
            <div class="kse-qty">
              <button class="kse-qty__btn">−</button>
              <input type="text" class="kse-qty__count">
              <button class="kse-qty__btn">+</button>
            </div>

            <button class="kse-cart-btn">
              <img src="../assets/images/Cart-icon.png">
            </button>
          </div>
        </div>
      </div>
    </div>



    <!-- with Button -->

    <div class="kse-PdTile">
      <div class="kse-PdTile__image-wrapper">
        <div class="kse-PdTile__badge"><span>15 <small>%</small> OFF</span> </div>
        <img src="../assets/images/chicken-1.png" alt="Chicken" class="kse-PdTile__image">
      </div>

      <div class="kse-PdTile__content">
        <h3 class="kse-PdTile__title">Lorem ipsum dolor sit</h3>
        <p class="kse-PdTile__desc">
          Lorem ipsum dolor sit amet, consectetuer adipiscing elit sed.
        </p>

        <div class="kse-PdTile__bottom">
          <div class="kse-PdTile__price">$00.0</div>

          <div class="kse-PdTile__actions">
            <a href="#" class="kse-btn kse-btn--sec">View Details</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
