<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Recipe card</title>
</head>

<body>
  <!-- body content start -->
  <div class="content-wrapper">
    <div class="kse-recipe-card" style="width: 25%;">
      <div class="kse-recipe-card__image">
        <img src="../assets/images/sweet&spicy.png" alt="Recipe" />
      </div>

      <div class="kse-recipe-card__body">
        <h3 class="kse-recipe-card__title">
          Sweet & Spicy Chicken
        </h3>

        <div class="kse-recipe-card__share">
          <span class="kse-recipe-card__share-text">Share</span>

          <div class="kse-recipe-card__icons">
            <a href="#" class="kse-recipe-card__icon">
              <img src="../assets/images/fb.svg" class="icon-default" />
              <img src="../assets/images/fb-white.svg" class="icon-hover" />
            </a>

            <a href="#" class="kse-recipe-card__icon">
              <img src="../assets/images/ig.svg" class="icon-default" />
              <img src="../assets/images/ig-white.svg" class="icon-hover" />
            </a>

            <a href="#" class="kse-recipe-card__icon">
              <img src="../assets/images/tik.svg" class="icon-default" />
              <img src="../assets/images/tik-white.svg" class="icon-hover" />
            </a>
          </div>
        </div>

        <div class="kse-recipe-card__cta">
          <a href="#" class="kse-btn kse-btn--sec">RECIPE</a>
        </div>
      </div>
    </div>

    <br>
    <br>

    <div class="kse-recipe-card kse-recipe-card--b" style="width: 25%;">
      <div class="kse-recipe-card__image">
        <img src="../assets/images/sweet&spicy.png" alt="Recipe" />
      </div>

      <div class="kse-recipe-card__body">
        <h3 class="kse-recipe-card__title">
          Jamie Oliver’s Chicken in milk (simplified)
        </h3>

        <div class="kse-recipe-card__share">
          <span class="kse-recipe-card__share-text">Share</span>

          <div class="kse-recipe-card__icons">
            <a href="#" class="kse-recipe-card__icon">
              <img src="../assets/images/fb.svg" class="icon-default" />
              <img src="../assets/images/fb-white.svg" class="icon-hover" />
            </a>

            <a href="#" class="kse-recipe-card__icon">
              <img src="../assets/images/ig.svg" class="icon-default" />
              <img src="../assets/images/ig-white.svg" class="icon-hover" />
            </a>

            <a href="#" class="kse-recipe-card__icon">
              <img src="../assets/images/tik.svg" class="icon-default" />
              <img src="../assets/images/tik-white.svg" class="icon-hover" />
            </a>
          </div>
        </div>

        <div class="kse-recipe-card__cta">
          <a href="#" class="kse-btn kse-btn--sec">Recipe</a>
        </div>
      </div>
    </div>
  </div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
