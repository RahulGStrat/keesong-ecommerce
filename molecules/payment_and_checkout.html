<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- styles -->

  <body>
    <!-- body content start -->

    <div class="kse-paymentbox">
  <div class="kse-paymentbox__left">
    <h3>PAYMENT & CHECKOUT</h3>
    <p>
      Enjoy a seamless and secure checkout. Pick your preferred
      method to confirm your order.
    </p>
  </div>

  <div class="kse-paymentbox__right">
    <label class="kse-paymentbox__option">
      <input type="radio" name="payment" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
    </label>

    <label class="kse-paymentbox__option">
      <input type="radio" name="payment" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="Visa">
    </label>

    <label class="kse-paymentbox__option">
      <input type="radio" name="payment" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Pay">
    </label>

    <label class="kse-paymentbox__option">
      <input type="radio" name="payment" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Pay">
    </label>

    <label class="kse-paymentbox__option">
      <input type="radio" name="payment" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal">
    </label>
  </div>
</div>

    <!-- body content end -->
