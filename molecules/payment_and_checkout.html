<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Document</title>
</head>

<body>
    <!-- body content start -->

    <div class="kse-paymentbox">
        <div class="kse-paymentbox__left">
            <h3>PAYMENT & CHECKOUT</h3>
            <p>
                Enjoy a seamless and secure checkout. Pick your preferred
                method to confirm your order.
            </p>
        </div>

        <div class="kse-paymentbox__right">
            <label class="kse-paymentbox__option kse-paymentbox__option--a">
                <input type="radio" name="payment" />
                <img src="../assets/images/mastercard.png" alt="Mastercard">
            </label>

            <label class="kse-paymentbox__option kse-paymentbox__option--b">
                <input type="radio" name="payment" />
                <img src="../assets/images/visa.png" alt="Visa">
            </label>

            <label class="kse-paymentbox__option kse-paymentbox__option--c">
                <input type="radio" name="payment" />
                <img src="../assets/images/Applepay.png" alt="Apple Pay">
            </label>

            <label class="kse-paymentbox__option kse-paymentbox__option--d">
                <input type="radio" name="payment" />
                <img src="../assets/images/Gpay.png" alt="Google Pay">
            </label>

            <label class="kse-paymentbox__option kse-paymentbox__option--d">
                <input type="radio" name="payment" />
                <img src="../assets/images/PayPal.png" alt="PayPal">
            </label>
        </div>
    </div>

    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
</body>

</html>
