<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Delivery detail</title>
</head>

<body>
  <!-- body content start -->
  <div class="content-wrapper">
    <div class="kse-delivery-detail">
      <h3 class="kse-delivery-detail__title">DELIVERY DETAIL</h3>

      <div class="kse-delivery-detail__grid">

        <!-- LEFT: SHIPPING -->
        <div class="kse-delivery-detail__col">
          <h4 class="kse-delivery-detail__subtitle">Shipping Detail</h4>

          <label class="kse-delivery-detail__label">Contact Name</label>
          <input type="text" placeholder="Name" />

          <label class="kse-delivery-detail__label">Contact No.</label>
          <input type="text" placeholder="1234 5678" />

          <label class="kse-delivery-detail__label">Address</label>

          <div class="kse-delivery-detail__row">
            <input type="text" placeholder="Block No." />
            <input type="text" placeholder="Unit No." />
          </div>

          <p class="kse-delivery-detail__note">
            (Please indicate "0" in the field "Unit Number" should your address not have a specific unit number.)
          </p>

          <input type="text" placeholder="Street Name" />
          <input type="text" placeholder="Postal Code" />
        </div>

        <!-- RIGHT: BILLING -->
        <div class="kse-delivery-detail__col">
          <div class="kse-delivery-detail__billing-head">
            <h4 class="kse-delivery-detail__subtitle">Billing Detail</h4>

            <label class="kse-delivery-detail__checkbox">
              <input type="checkbox" />
              <span>Same as shipping address</span>
            </label>
          </div>

          <label class="kse-delivery-detail__label">Contact Name</label>
          <input type="text" placeholder="Name" />

          <label class="kse-delivery-detail__label">Contact No.</label>
          <input type="text" placeholder="1234 5678" />

          <label class="kse-delivery-detail__label">Address</label>

          <div class="kse-delivery-detail__row">
            <input type="text" placeholder="Block No." />
            <input type="text" placeholder="Unit No." />
          </div>

          <p class="kse-delivery-detail__note">
            (Please indicate "0" in the field "Unit Number" should your address not have a specific unit number.)
          </p>

          <input type="text" placeholder="Street Name" />
          <input type="text" placeholder="Postal Code" />
        </div>

      </div>

      <div class="kse-delivery-detail__cta">
        <a href="#" class="kse-btn kse-btn--sec">Submit</a>
      </div>
    </div>
  </div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
