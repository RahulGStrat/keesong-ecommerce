<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Poll Chart Card</title>
</head>

<body>
    <!-- body content start -->
    <!-- <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                

            </div>
        </div>
    </div> -->

    <div class="kse-pollchartcard">
                    <div class="kse-pollchartcard__inner">
                        <div class="kse-pollchartcard__chart">
                            <div class="kse-pollchartcard__option">
                                <img class="kse-pollchartcard__image" src="../assets/images/kse_offer_1.png" alt="{{option_1_title}}" />
                                <h3 class="kse-pollchartcard__title">Fresh Chicken</h3>
                                <div class="kse-pollchartcard__overlay" style="height: 20%;">
                                    <span class="kse-pollchartcard__percentage">20%</span>
                                </div>
                            </div>
                            <div class="kse-pollchartcard__option">
                                <img class="kse-pollchartcard__image" src="../assets/images/kse_offer_2.png" alt="{{option_2_title}}" />
                                <h3 class="kse-pollchartcard__title">Frozen Chicken</h3>
                                <div class="kse-pollchartcard__overlay" style="height: 40%;">
                                    <span class="kse-pollchartcard__percentage">40%</span>
                                </div>
                            </div>
                        </div>
                        <h3>Select your favourite!</h3>
                        <p class="kse-pollchartcard__votes">5 votes</p>
                        <div class="kse-pollchartcard__actions">
                            <button class="kse-pollchartcard__button">Fresh Chicken!</button>
                            <button class="kse-pollchartcard__button">Frozen Chicken!</button>
                        </div>
                    </div>
                </div>
    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
</body>

</html>
