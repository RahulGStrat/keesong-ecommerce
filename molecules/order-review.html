<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Order review</title>
</head>

<body>
  <!-- body content start -->
  <div class="content-wrapper">
    <div class="kse-order-review mt-5">

      <h3 class="kse-order-review__title bold">ORDER REVIEW</h3>

      <div class="kse-order-review__row">
        <span>Subtotal:</span>
        <span class="bold">$0.00</span>
      </div>

      <div class="kse-order-review__promo">
        <input type="text" placeholder="PROMO CODE" />
        <button class="bold">APPLY</button>
      </div>

      <div class="kse-order-review__row">
        <span>Delivery Fee:</span>
        <span>$0.00</span>
      </div>

      <div class="kse-order-review__row kse-order-review__row--total">
        <span>Order Total:</span>
        <span class="bold">$0.00</span>
      </div>
      <div class="kse-order-review__row">
        <span class="kse-order-review__totalsub">Lorem ipsum</span>
      </div>

      <div class="kse-order-review__note">
        Check your items, quantities, and delivery details before confirming your order.
      </div>

      <a href="#" class="kse-btn kse-btn--sec">Checkout</a>

    </div>
  </div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
