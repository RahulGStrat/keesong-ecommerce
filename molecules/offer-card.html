<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Offer card</title>
</head>

<body>
  <!-- body content start -->
  <div class="content-wrapper">
    <div class="kse-offer__card" style="background-image: url('../assets/images/quality-meals.png');">
      <div class="kse-offer__content">
        <h2 class="kse-offer__title">
          Quality meals begin <br />
          with trusted ingredients.
        </h2>

        <p class="kse-offer__subtitle">
          Sign up as a member & receive
        </p>

        <div class="kse-offer__discount">
          <span class="kse-offer__amount">$5</span>
          <span class="kse-offer__off">OFF</span>
        </div>

        <p class="kse-offer__note">
          for your first order!
        </p>

        <div class="kse-offer__cta">
          <a href="#" class="kse-btn kse-btn--pri">Redeem Now</a>
        </div>
      </div>
    </div>
  </div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
