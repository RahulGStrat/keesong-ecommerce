<body>
    <!-- body content start -->
    <div id="container" class="kse-sVoyage" style="background-image: url(../assets/images/voyageBg.png);">
        <div class="content-wrapper">
            <div class="kse-sVoyage__in">
                <!-- Left Content -->
                <div class="kse-sVoyage__content">
                    <h1 class="kse-sVoyage__title">
                        Good Taste <br>
                        Travels Far: <br>
                        Sakura Voyage
                    </h1>

                    <p class="kse-sVoyage__desc">
                        Every Sakura Chicken purchase <br> blooms into petals.
                        Redeem rewards <br> or ride towards your dream voyage – <br>
                        a chance for a special getaway
                    </p>

                    <a href="#" class="kse-sVoyage__btn">

                        <svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 43.34 43.34">
                        <g id="Layer_1-2" data-name="Layer_1">
                            <path class="cls-1" d="M21.67,1C10.25,1,1,10.25,1,21.67c0,3.76,1,7.28,2.75,10.31l-2.75,10.36,10.74-2.54c2.95,1.62,6.33,2.54,9.93,2.54,11.41,0,20.67-9.25,20.67-20.67S33.08,1,21.67,1Z"/>
                            <path class="cls-1" d="M27.01,24.68l5.51,2.6c.25.12.42.38.39.65-.06.73-.35,2.18-1.65,3.48-3.68,3.68-10.28-.48-10.55-.64-1.62-.87-3.17-2.04-4.63-3.5-1.46-1.46-2.63-3.01-3.5-4.63-.16-.27-4.32-6.87-.64-10.55,1.3-1.3,2.76-1.59,3.48-1.65.28-.02.54.14.65.39l2.6,5.51c.12.26.07.57-.13.77l-1.94,1.94c-.42.42-.54,1.07-.25,1.59.71,1.27,1.66,2.49,2.76,3.61,1.12,1.1,2.34,2.05,3.61,2.76.52.29,1.17.17,1.59-.25l1.94-1.94c.2-.2.51-.26.77-.13h0Z"/>
                        </g>
                        </svg> GET REWARDED NOW

                <!-- Right Visual -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src='//cdnjs.cloudflare.com/ajax/libs/gsap/1.18.0/TweenMax.min.js'></script>
    <script src="../assets/js/script.js"></script>
    <script>
        // ========================== Star Petals Falling ==============================================

TweenLite.set("#container", { perspective: 600 });
        TweenLite.set("img", { xPercent: "-50%", yPercent: "-50%" });

        var total = 30;
        var warp = document.getElementById("container"),
            w = window.innerWidth,
            h = window.innerHeight;

        for (i = 0; i < total; i++) {
            var Div = document.createElement('div');

            // 👉 Spawn ONLY in right half
            TweenLite.set(Div, {
                attr: { class: 'dot' },
                x: R(w / 4, w),     // right 50% only
                y: R(-800, -50),    // start from top
                z: R(-200, 200)
            });

            warp.appendChild(Div);
            animm(Div);
        }

        function animm(elm) {
            // 👉 Fall top → bottom
            TweenMax.to(elm, R(6, 15), {
                y: h + 100,
                ease: Linear.easeNone,
                repeat: -1,
                delay: -15
            });

            // 👉 Slight horizontal floating (keep within right side feel)
            TweenMax.to(elm, R(4, 8), {
                x: "+=60", // smaller drift so it doesn’t cross to left side
                rotationZ: R(0, 180),
                repeat: -1,
                yoyo: true,
                ease: Sine.easeInOut
            });

            TweenMax.to(elm, R(2, 8), {
                rotationX: R(0, 360),
                rotationY: R(0, 360),
                repeat: -1,
                yoyo: true,
                ease: Sine.easeInOut,
                delay: -5
            });
        }

        function R(min, max) {
            return min + Math.random() * (max - min);
        }
    </script>
    <!-- scripts -->
</body>

</html>
