<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSE Header</title>

<style>
/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.kse-Head {
  position: relative;
  background: #fff;
  border-bottom: 1px solid #eee;
}

.kse-Head__container {
  max-width: 1200px;
  margin: auto;
  padding: 15px 20px;
  display: flex;
  align-items: flex-start;
  gap: 20px;
}

/* =========================
   LEFT
========================= */
.kse-Head__left img {
  height: 45px;
}

/* =========================
   CENTER
========================= */
.kse-Head__center {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.kse-Head__search input {
  width: 100%;
  padding: 10px;
  border: none;
  background: #f2f2f2;
  border-radius: 4px;
}

/* MENU */
.kse-Head__menu {
  display: flex;
  gap: 16px;
  list-style: none;
  padding: 0;
  margin: 0;
}

.kse-Head__menu li {
  position: relative;
}

.kse-Head__menu a {
  text-decoration: none;
  font-size: 13px;
  text-transform: uppercase;
  color: #333;
}

.kse-Head__menu li::after {
  content: "|";
  position: absolute;
  right: -10px;
  color: #ccc;
}

.kse-Head__menu li:last-child::after {
  display: none;
}

/* ARROW */
.kse-Head__arrow {
  display: inline-block;
  margin-left: 5px;
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 6px solid #333;
  transition: 0.3s;
}

.kse-Head__menu-item.active .kse-Head__arrow {
  transform: rotate(180deg);
}

/* =========================
   RIGHT
========================= */
.kse-Head__right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}

.kse-Head__actions {
  display: flex;
  gap: 8px;
  font-size: 13px;
}

.kse-Head__btn {
  background: #ff4d4d;
  color: #fff;
  padding: 8px 14px;
  text-decoration: none;
  border-radius: 4px;
  font-size: 12px;
}

/* =========================
   MEGA MENU (OUTSIDE)
========================= */
.kse-Head__megaWrap {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  background: #fff;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  z-index: 999;
}

.kse-Head__megaWrap.active {
  display: block;
}

.kse-Head__mega {
  max-width: 1200px;
  margin: auto;
  padding: 25px 20px;
}

.kse-Head__mega-inner {
  display: flex;
  gap: 40px;
}

.kse-Head__mega-col h4 {
  margin-bottom: 10px;
}

.kse-Head__mega-col ul {
  list-style: none;
  padding: 0;
}

.kse-Head__mega-col li {
  margin-bottom: 6px;
}

/* =========================
   HAMBURGER
========================= */
.kse-Head__hamburger {
  display: none;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}

.kse-Head__hamburger span {
  width: 22px;
  height: 2px;
  background: #333;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 991px) {

  .kse-Head__hamburger {
    display: flex;
  }

  .kse-Head__center {
    position: fixed;
    top: 0;
    left: -100%;
    width: 280px;
    height: 100%;
    background: #fff;
    padding: 20px;
    transition: 0.3s;
    z-index: 1000;
  }

  .kse-Head__center.active {
    left: 0;
  }

  .kse-Head__menu {
    flex-direction: column;
    gap: 12px;
  }

  .kse-Head__menu li::after {
    display: none;
  }

  .kse-Head__right {
    display: none;
  }

  /* Disable desktop mega on mobile */
  .kse-Head__megaWrap {
    display: none !important;
  }
}
</style>
</head>

<body>

<header class="kse-Head">

  <div class="kse-Head__container">

    <!-- LEFT -->
    <div class="kse-Head__left">
      <img src="https://via.placeholder.com/120x40" alt="Logo">
    </div>

    <!-- HAMBURGER -->
    <div class="kse-Head__hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- CENTER -->
    <div class="kse-Head__center" id="menuWrap">

      <div class="kse-Head__search">
        <input type="text" placeholder="Search">
      </div>

      <ul class="kse-Head__menu">
        <li class="kse-Head__menu-item kse-Head__menu-item--category">
          <a href="#">Categories <span class="kse-Head__arrow"></span></a>
        </li>
        <li><a href="#">Special Offers</a></li>
        <li><a href="#">Savings Voyage</a></li>
        <li><a href="#">Brand Partners</a></li>
        <li><a href="#">Bundles</a></li>
        <li><a href="#">Promotions</a></li>
        <li><a href="#">Recipes</a></li>
        <li><a href="#">Merchandise</a></li>
      </ul>

    </div>

    <!-- RIGHT -->
    <div class="kse-Head__right">
      <div class="kse-Head__actions">
        <span>🔍</span>
        <span>👤</span>
        <span>Hi Name</span>
        <span>🛒 3</span>
      </div>
      <a href="#" class="kse-Head__btn">Ordering Guide</a>
    </div>

  </div>

</header>

<!-- MEGA MENU -->
<div class="kse-Head__megaWrap" id="menuWrap">
  <div class="kse-Head__mega">
    <div class="kse-Head__mega-inner">

      <div class="kse-Head__mega-col">
        <h4>Chicken</h4>
        <ul>
          <li><a href="#">Fresh Chicken</a></li>
          <li><a href="#">Frozen Chicken</a></li>
        </ul>
      </div>

      <div class="kse-Head__mega-col">
        <h4>Duck</h4>
        <ul>
          <li><a href="#">Whole Duck</a></li>
          <li><a href="#">Cuts</a></li>
        </ul>
      </div>

      <div class="kse-Head__mega-col">
        <h4>Ready to Cook</h4>
        <ul>
          <li><a href="#">BBQ</a></li>
          <li><a href="#">Marinated</a></li>
        </ul>
      </div>

    </div>
  </div>
</div>

<!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
<script>
const hamburger = document.getElementById("hamburger");
const menuWrap = document.getElementById("menuWrap");
const category = document.querySelector(".kse-Head__menu-item--category");
const megaMenu = document.getElementById("megaMenu");

// Hamburger
hamburger.addEventListener("click", () => {
  menuWrap.classList.toggle("active");
});

// Category click
category.addEventListener("click", function(e) {
  e.preventDefault();

  if (window.innerWidth > 991) {
    this.classList.toggle("active");
    megaMenu.classList.toggle("active");
  } else {
    this.classList.toggle("active");
  }
});

// Close outside
document.addEventListener("click", function(e) {
  if (!category.contains(e.target) && !megaMenu.contains(e.target)) {
    category.classList.remove("active");
    megaMenu.classList.remove("active");
  }
});
</script>

</body>
</html>
