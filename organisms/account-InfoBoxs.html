<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Account Info Boxes</title>
</head>

<body style="padding: 30px;">
  <!-- body content start -->
  <!-- 1 -->
  <div class="kse-acBox">
    <div class="kse-acBox__header">
      <h2 class="kse-acBox__title">Personal Information</h2>
    </div>

    <div class="kse-acBox__body">

      <div class="kse-acBox__pi">
        <div class="kse-acBox__pi-form">
          <div class="kse-acBox__pi-group">
            <label class="kse-acBox__pi-label">Email</label>
            <input type="email" class="kse-acBox__pi-input" value="xxxxxxxxxx@gmail.com" disabled>
          </div>
          <div class="kse-acBox__pi-group">
            <label class="kse-acBox__pi-label">Name <span class="kse-acBox__pi-required">*</span></label>
            <input type="text" class="kse-acBox__pi-input">
          </div>
          <div class="kse-acBox__pi-group">
            <label class="kse-acBox__pi-label">
              Mobile Number <span class="kse-acBox__pi-required">*</span>
            </label>
            <div class="kse-acBox__pi-mobile">
              <span class="kse-acBox__pi-mobile-code">+65</span>
              <input type="text" class="kse-acBox__pi-input">
            </div>
          </div>
        </div>
        <!--  -->
        <div class="kse-acBox__pi-btm">
          <div class="">
            <!-- Info Text -->
            <p class="kse-acBox__pi-info">
              To update your email address, please contact our admin via WhatsApp at +65 XXXX XXXX.
            </p>

            <!-- Mandatory -->
            <p class="kse-acBox__pi-mandatory">
              * Mandatory Information
            </p>
          </div>
          <button class="kse-acBox__addBtn">

            <span class="kse-acBox__icon kse-acBox__icon--save">
              <svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 27.79 26.36">
                <g id="Layer_3">
                  <g>
                    <path class="cls-1"
                      d="M2.89,11.06c-.58-.65-.58-1.66,0-2.31.65-.65,1.66-.65,2.31,0l7.07,7V1.66c0-.94.72-1.66,1.59-1.66.94,0,1.66.72,1.66,1.66v14.09l7.07-7c.65-.65,1.66-.65,2.31,0,.58.65.58,1.66,0,2.31l-9.89,9.74c-.65.65-1.66.65-2.24,0L2.89,11.06Z" />
                    <path class="cls-1" d="M27.79,15.1v11.26H0v-11.26l3.18,3.18v4.84h21.44v-4.84l3.18-3.18Z" />
                  </g>
                </g>
              </svg>
            </span>
            <span class="kse-acBox__btnText">Save</span>
          </button>
        </div>

      </div>
    </div>
  </div>
  <br>
  <br>
  <!-- 2 -->
  <div class="kse-acBox">
    <div class="kse-acBox__header">
      <h2 class="kse-acBox__title">Password Setting</h2>
    </div>

    <div class="kse-acBox__body">
      <p class="kse-acBox__empty">To chnage your password. <a href="#" class="kse-acBox__body-link">Click Here</a></p>
    </div>
  </div>
  <br>
  <br>
  <!-- 3 -->
  <div class="kse-acBox">
    <div class="kse-acBox__header">
      <h2 class="kse-acBox__title">My Addresses</h2>
    </div>

    <div class="kse-acBox__body">
      <p class="kse-acBox__empty">No available addresses!</p>

      <button class="kse-acBox__addBtn">

        <span class="kse-acBox__icon">
          <svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25.95 25.95">
            <g id="Layer_3">
              <line class="cls-1" x1="12.97" y1="1.6" x2="12.97" y2="24.35" />
              <line class="cls-1" x1="1.6" y1="12.97" x2="24.35" y2="12.97" />
            </g>
          </svg>
        </span>
        <span class="kse-acBox__btnText">Add new</span>
      </button>
    </div>
  </div>
  <br>
  <br>
  <!-- 4 -->
  <div class="kse-acBox">
    <div class="kse-acBox__header">
      <h2 class="kse-acBox__title">My Cards</h2>
    </div>

    <div class="kse-acBox__body">
      <p class="kse-acBox__empty">No available cards</p>

      <button class="kse-acBox__addBtn">

        <span class="kse-acBox__icon">
          <svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25.95 25.95">
            <g id="Layer_3">
              <line class="cls-1" x1="12.97" y1="1.6" x2="12.97" y2="24.35" />
              <line class="cls-1" x1="1.6" y1="12.97" x2="24.35" y2="12.97" />
            </g>
          </svg>
        </span>
        <span class="kse-acBox__btnText">Add new / manage card</span>
      </button>
    </div>
  </div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
