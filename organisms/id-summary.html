<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Id Summary</title>
  </head>
  <body style="background-color: #ccc; height: 100vh; padding: 30px;">
    <!-- body content start -->
      <div class="kse-idSumry">

  <!-- Card 1 -->
  <div class="kse-idSumry__card kse-idSumry__card--pink">
    <div class="kse-idSumry__avatar">
      <img src="../assets/images/id-img.svg" alt="avatar">
    </div>
    <div class="kse-idSumry__text">
      <p class="kse-idSumry__idLbl">Membership ID</p>
      <h3 class="kse-idSumry__idNum">KS048103</h3>
    </div>
  </div>

  <!-- Card 2 -->
  <div class="kse-idSumry__card kse-idSumry__card--white">
    <div class="kse-idSumry__points-out">
    <h2 class="kse-idSumry__points">
      200 <span class="kse-idSumry__points-text">POINTS</span>
    </h2>
    <span class="kse-idSumry__eql">=</span>
    <span class="kse-idSumry__money">S$5</span>
    </div>
    <p class="kse-idSumry__desc">Available Points</p>
  </div>

  <!-- Card 3 -->
  <div class="kse-idSumry__card kse-idSumry__card--green">
    <h2 class="kse-idSumry__points">
      700 <span class="kse-idSumry__points-text">POINTS</span>
    </h2>
    <p class="kse-idSumry__desc">Total Points Earned</p>
  </div>

</div>
    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
  </body>
</html>
