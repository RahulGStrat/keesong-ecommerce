<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Filter</title>
</head>

<body style="padding: 30px;">
  <!-- body content start -->
  <div class="kse-filterNav__main">
    <div class="kse-filterNav__heading">FILTER BY</div>
    <div class="accordion kse-filterNav" id="filterAccordion">

      <!-- Categories -->
      <div class="accordion-item kse-filterNav__item">
        <h2 class="" id="headingOne">
          <button class="kse-filterNav__list accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseOne">
            CATEGORIES
          </button>
        </h2>

        <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#filterAccordion">
          <div class="accordion-body p-0">

            <div class="kse-filterNav__check">
              <input class="kse-filterNav__check-input" type="checkbox" id="cat1">
              <label class="kse-filterNav__check-label" for="cat1">Chinese</label>
            </div>

            <div class="kse-filterNav__check">
              <input class="kse-filterNav__check-input" type="checkbox" id="cat2">
              <label class="kse-filterNav__check-label" for="cat2">Western</label>
            </div>

            <div class="kse-filterNav__check">
              <input class="kse-filterNav__check-input" type="checkbox" id="cat3">
              <label class="kse-filterNav__check-label" for="cat3">Middle Eastern</label>
            </div>

            <div class="kse-filterNav__check">
              <input class="kse-filterNav__check-input" type="checkbox" id="cat4">
              <label class="kse-filterNav__check-label" for="cat4">Indian</label>
            </div>

            <div class="kse-filterNav__check">
              <input class="kse-filterNav__check-input" type="checkbox" id="cat5">
              <label class="kse-filterNav__check-label" for="cat5">Fusion</label>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
