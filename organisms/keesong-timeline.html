<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Keesong timeline</title>
</head>

<body>
  <!-- body content start -->
  <div class="kse-timeline">

    <!-- SVG Path Layer -->
    <svg class="kse-timeline__svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <path d="M50,100 
         H950 
         Q980,100 980,130 
         V230 
         Q980,260 950,260 
         H50 
         Q20,260 20,290 
         V390 
         Q20,420 50,420 
         H950" fill="none" stroke="#e34b5b" stroke-width="2" stroke-dasharray="6 6" />
    </svg>

    <!-- Grid Content -->
    <div class="kse-timeline__grid">

      <!-- ITEM -->
      <div class="kse-timeline__item">
        <div class="kse-timeline__dot"></div>
        <h4 class="kse-timeline__year">1987</h4>
        <p class="kse-timeline__text">Company founded and began operations.</p>
        <img src="../assets/images/apron-1.png" />
      </div>

      <div class="kse-timeline__item">
        <div class="kse-timeline__dot"></div>
        <h4 class="kse-timeline__year">1990</h4>
        <p class="kse-timeline__text">Expansion into regional markets.</p>
        <img src="../assets/images/apron-1.png" />
      </div>

      <div class="kse-timeline__item">
        <div class="kse-timeline__dot"></div>
        <h4 class="kse-timeline__year">2000</h4>
        <p class="kse-timeline__text">Major production milestone achieved.</p>
        <img src="../assets/images/apron-1.png" />
      </div>

      <div class="kse-timeline__item">
        <div class="kse-timeline__dot"></div>
        <h4 class="kse-timeline__year">2010</h4>
        <p class="kse-timeline__text">Launched new product lines.</p>
        <img src="../assets/images/apron-1.png" />
      </div>

      <div class="kse-timeline__item">
        <div class="kse-timeline__dot"></div>
        <h4 class="kse-timeline__year">2020</h4>
        <p class="kse-timeline__text">Digital transformation phase.</p>
        <img src="../assets/images/apron-1.png" />
      </div>

    </div>
  </div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="../assets/js/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
</body>

</html>
