<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Document</title>
</head>

<body>
    <!-- body content start -->

    <div class="kse-forgot kse-reset">
        <div class="content-wrapper">
            <a href="#" class="kse-forgot__back">
                <span class="kse-forgot__back-icon">
                    <img src="../assets/images/kse-backarrow.png" alt="back">
                </span>
                <span class="kse-forgot__back-text">Back to sign in</span>
            </a>
            <div class="kse-forgot__wrapper">
                <div class="kse-forgot__inner">
                    <h1 class="kse-forgot__title">Reset password?</h1>

                    <form class="kse-forgot__form">
                        <div class="kse-forgot__formgrp">
                            <label class="kse-forgot__label">New password</label>
                            <input type="password" class="kse-forgot__input" placeholder="New password" />
                        </div>
                        <div class="kse-forgot__formgrp">
                            <label class="kse-forgot__label">Confirm password</label>
                            <input type="password" class="kse-forgot__input" placeholder="Confirm password" />
                        </div>
                        <a href="#" class="kse-btn kse-btn--sec">Reset Password</a>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
</body>

</html>
