<body>
    <!-- body content start -->
    <div class="kse-blogfiltercard__outer" style="background-image: url(../assets/images/blogfiltercard_bg.png);">
        <div class="content-wrapper">
            <div class="kse-blogfiltercard">

            <h1 class="kse-blogfiltercard__title">
                What are you looking for?
            </h1>

            <!-- FIELD 1 -->

            <div class="kse-blogfiltercard__formgrp">

                <label>
                    I am looking for chicken for my
                </label>

                <select class="kse-blogfiltercard__cstmselect">

                    <option value="" selected disabled hidden>
                        -- Select --
                    </option>
                    <option value="home">Home</option>
                    <option value="restaurant">Restaurant</option>
                    <option value="farm">Farm</option>

                </select>

            </div>

            <!-- FIELD 2 -->

            <div class="kse-blogfiltercard__formgrp">

                <label>
                    I prefer
                </label>
                <select class="kse-blogfiltercard__cstmselect">

                    <option value="" selected disabled hidden>
                        -- Select --
                    </option>

                    <option value="Fresh Chicken">Fresh Chicken</option>
                    <option value="Frozen Chicken">Frozen Chicken</option>
                    <option value="Organic Chicken">Organic Chicken</option>

                </select>

            </div>

            <!-- FIELD 3 -->

            <div class="kse-blogfiltercard__formgrp">

                <label>
                    From
                </label>
                <select class="kse-blogfiltercard__cstmselect">

                    <option value="" selected disabled hidden>
                        -- Select --
                    </option>

                    <option value="Singapore">Singapore</option>
                    <option value="Malaysia">Malaysia</option>
                </select>

            </div>

            <!-- BUTTON -->

            <a href="#" class="kse-btn kse-btn--header">Explore Now</a>

        </div>
        </div>
    </div>


    <!-- body content end -->
