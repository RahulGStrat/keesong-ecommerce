<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Document</title>
  </head>
  <body>
    <!-- body content start -->
     <div class="pdp-productsec">
  <div class="container">
    <div class="pdp-productsec__out">

      <!-- LEFT: IMAGES -->
      <div class="pdp-productsec__images">
        <div class="main-img">
          <img src="/assets/images/chicken-1.png" alt="product" />
          <span class="offer-badge">5% OFF</span>
        </div>

        <div class="thumbs">
          <img src="/assets/images/chicken-1.png" />
          <img src="/assets/images/chicken-1.png" />
          <img src="/assets/images/chicken-1.png" />
          <img src="/assets/images/chicken-1.png" />
        </div>
      </div>

      <!-- RIGHT: DETAILS -->
      <div class="pdp-productsec__details">
        <h1 class="title">Lorem ipsum</h1>

        <p><strong>Brand:</strong> Lorem Ipsum</p>
        <p><strong>Country of Origin:</strong> Lorem Ipsum</p>

        <div class="price">
          <span class="new">$000.00/pkt</span>
          <span class="old">$189.00/pkt</span>
        </div>

        <div class="quantity">
          <span>Quantity:</span>
          <div class="qty-box">
            <button>-</button>
            <input type="text" value="1" />
            <button>+</button>
          </div>
        </div>

        <div class="actions">
          <button class="add-cart">Add to Cart 🛒</button>
          <button class="wishlist">Add to Wishlist</button>
        </div>

        <p class="note">
          * Lorem ipsum dolor sit amet, consectetuer adipiscing elit...
        </p>
      </div>

    </div>
  </div>
</div>
    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
  </body>
</html>
